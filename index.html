<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>52 Ricordi</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f2eb;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .app {
      max-width: 600px;
      margin: 60px auto;
      text-align: center;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 35px 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 5px;
    }

    .sottotitolo {
      color: #777;
      font-size: 18px;
      margin-bottom: 35px;
    }

    .ok {
      font-size: 60px;
      margin-bottom: 15px;
    }

    p {
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>52 Ricordi</h1>

    <div class="sottotitolo">
      Un anno della nostra famiglia
    </div>

    <div class="card">

      <div class="ok">📷</div>

      <h2>La nuova app è online!</h2>

      <p>
        Ogni settimana, una foto e un ricordo
        della nostra famiglia.
      </p>

    </div>

  </div>

</body>
</html>
